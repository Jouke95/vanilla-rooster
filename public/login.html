<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Inloggen · Weekrooster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap');
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body { background: #EDF0F2; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B2A4A; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    form { background: #FFFFFF; border: 1px solid #C9CDD3; border-radius: 8px; padding: 24px 26px; width: 320px; max-width: 100%; box-sizing: border-box; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
    p { margin: 0 0 18px; font-size: 13px; color: #5A6472; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #5A6472; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px; border: 1px solid #C9CDD3; border-radius: 6px; padding: 8px 10px; color: #1B2A4A; }
    input:focus { outline: 2px solid #1B2A4A; outline-offset: -1px; }
    button { width: 100%; margin-top: 14px; border: 1px solid #1B2A4A; background: #1B2A4A; color: #FFFFFF; border-radius: 6px; padding: 9px 0; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #14203a; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { margin-top: 12px; font-size: 13px; color: #A9433F; min-height: 1em; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>Weekrooster</h1>
    <p>Log in om het rooster te bekijken.</p>
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
    <button type="submit">Inloggen</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const button = form.querySelector("button");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorEl.textContent = "";
      button.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value })
        });
        if (res.ok) { window.location.href = "/"; return; }
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || "Inloggen mislukt";
      } catch (err) {
        errorEl.textContent = "Geen verbinding met de server";
      }
      button.disabled = false;
    });
  </script>
</body>
</html>

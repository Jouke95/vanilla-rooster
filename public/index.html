<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Weekrooster routes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect } = React;

const DAY_NAMES = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag"];
function getMondayOfThisWeek() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  return monday;
}
function formatDayDate(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
}
function formatDayDateWithYear(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
}

const SEED_ROUTES_PER_DAY = [
  [
    { code: "We Supply" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "We Supply" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" }
  ],
  [
    { code: "Haarlem" },
    { code: "Noord-Holland" },
    { code: "'s Hertogenbosch" },
    { code: "Den Haag" },
    { code: "Rotterdam" },
    { code: "West Brabant" }
  ],
  [
    { code: "Oost 1" },
    { code: "Oost 2" },
    { code: "Oost Brabant" },
    { code: "'t Gooi" },
    { code: "Groene Hart" },
    { code: "Noord" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" },
    { code: "Zeeland" },
    { code: "Den Haag" },
    { code: "Rotterdam" }
  ]
];
function isFixedRoute(dayIndex, code) {
  return SEED_ROUTES_PER_DAY[dayIndex].some(r => r.code === code);
}

function weekKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addWeeks(date, n) { const d = new Date(date); d.setDate(d.getDate() + n * 7); return d; }
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function groupRoutesByDay(monday, rawRoutes) {
  return DAY_NAMES.map((name, i) => {
    const dateObj = new Date(monday);
    dateObj.setDate(monday.getDate() + i);
    return {
      id: `day-${i}`,
      dayIndex: i,
      name,
      date: formatDayDate(dateObj),
      isoDate: weekKey(dateObj),
      routes: rawRoutes.filter(r => r.day_index === i).map(r => ({ id: r.id, code: r.code, driver: r.driver_name || "", fixed: r.fixed }))
    };
  });
}

function isOnVacation(vacations, driverName, isoDate) {
  return vacations.some(v => v.driver_name === driverName && v.type !== "unavailable" && isoDate >= v.start_date && isoDate <= v.end_date);
}
function isUnavailable(vacations, driverName, isoDate) {
  return vacations.some(v => v.driver_name === driverName && v.type === "unavailable" && isoDate >= v.start_date && isoDate <= v.end_date);
}

// Label in een roostercel als iemand die dag ook in het andere rooster staat; oranje bij dubbele inplanning
function CrossLabel({ warn, children }) {
  return React.createElement("div", { title: warn ? "Dubbel ingepland: rijdt én magazijn" : undefined, style: { fontSize: "11px", fontWeight: 600, color: warn ? "#A9433F" : "#8A93A0", background: warn ? "#FBEDE0" : "transparent", border: warn ? "1px solid #E8A33D" : "1px solid transparent", borderRadius: "4px", padding: "1px 5px", marginBottom: "3px", textAlign: "center" } }, warn ? "⚠ " : "", children);
}

function VacationPanel({ teamNames, driverIdByName, vacations, setVacations }) {
  const [vacDriver, setVacDriver] = useState("");
  const [vacStart, setVacStart] = useState("");
  const [vacEnd, setVacEnd] = useState("");

  useEffect(() => {
    if (!teamNames.includes(vacDriver) && teamNames.length > 0) setVacDriver(teamNames[0]);
  }, [teamNames.join("|")]);

  const addVacation = async () => {
    if (!vacDriver || !vacStart || !vacEnd || vacStart > vacEnd) return;
    const driver_id = driverIdByName[vacDriver];
    const res = await fetch("/api/vacations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driver_id, start_date: vacStart, end_date: vacEnd, type: "vacation" })
    });
    const created = await res.json();
    setVacations(prev => [...prev, { ...created, driver_name: vacDriver }]);
    setVacStart(""); setVacEnd("");
  };

  const removeVacation = async id => {
    await fetch(`/api/vacations/${id}`, { method: "DELETE" });
    setVacations(prev => prev.filter(v => v.id !== id));
  };

  const vacationsByDriver = {};
  vacations.filter(v => v.type !== "unavailable" && teamNames.includes(v.driver_name)).forEach(v => {
    if (!vacationsByDriver[v.driver_name]) vacationsByDriver[v.driver_name] = [];
    vacationsByDriver[v.driver_name].push(v);
  });
  const sortedVacationDriverNames = Object.keys(vacationsByDriver).sort((a, b) => a.localeCompare(b));
  sortedVacationDriverNames.forEach(name => {
    vacationsByDriver[name].sort((a, b) => a.start_date.localeCompare(b.start_date));
  });

  return React.createElement("div", { style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px" } },
    React.createElement("div", { style: { fontSize: "13px", fontWeight: 600, color: "#5A6472", marginBottom: "8px" } }, "Vakantie/vrij"),
    React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px" } },
      React.createElement("select", { value: vacDriver, onChange: e => setVacDriver(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "13px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "4px 6px", background: "#FFFFFF", color: "#1B2A4A" } },
        teamNames.map(name => React.createElement("option", { key: name, value: name }, name))
      ),
      React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "6px" } },
        React.createElement("input", { type: "date", value: vacStart, onChange: e => setVacStart(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } }),
        React.createElement("span", { style: { color: "#8A93A0", fontSize: "12px" } }, "t/m"),
        React.createElement("input", { type: "date", value: vacEnd, onChange: e => setVacEnd(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } })
      ),
      React.createElement("button", { className: "rr-vac-add-btn", onClick: addVacation, style: { width: "100%", border: "1px solid #1B2A4A", background: "#1B2A4A", color: "#FFFFFF", borderRadius: "5px", padding: "6px 9px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer", marginTop: "2px" } }, "Toevoegen")
    ),
    sortedVacationDriverNames.length > 0 && React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "10px" } },
      sortedVacationDriverNames.map(name => React.createElement("div", { key: name },
        React.createElement("div", { style: { fontSize: "12px", fontWeight: 600, color: "#5A6472", marginBottom: "4px" } }, name),
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "4px" } },
          vacationsByDriver[name].map(v => {
            const isSameDay = v.start_date === v.end_date;
            const label = isSameDay
              ? formatDayDateWithYear(new Date(v.start_date))
              : `${formatDayDateWithYear(new Date(v.start_date))} – ${formatDayDateWithYear(new Date(v.end_date))}`;
            return React.createElement("div", { key: v.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "6px", background: "#FBEDE0", border: "1px solid #E8A33D", borderRadius: "6px", padding: "4px 8px", fontSize: "12px", color: "#7A3B10" } },
              React.createElement("span", null, label),
              React.createElement("span", { onClick: () => { if (window.confirm(`Vakantie van ${name} verwijderen?`)) removeVacation(v.id); }, title: "Verwijderen", style: { cursor: "pointer", color: "#A9433F", flexShrink: 0 } }, "×")
            );
          })
        )
      ))
    )
  );
}

// team is "is_driver" of "is_warehouse"; iemand die uit zijn laatste team wordt gehaald, wordt helemaal verwijderd
function PeopleBar({ team, label, otherLabel, driversRaw, setDriversRaw, setVacations, onPersonClick }) {
  const [newName, setNewName] = useState("");
  const otherTeam = team === "is_driver" ? "is_warehouse" : "is_driver";
  const members = driversRaw.filter(d => d[team]);
  const linkable = driversRaw.filter(d => !d[team] && d[otherTeam]).sort((a, b) => a.name.localeCompare(b.name));

  const setMembership = async (person, value) => {
    const res = await fetch(`/api/drivers/${person.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [team]: value })
    });
    const updated = await res.json();
    setDriversRaw(prev => prev.map(d => d.id === updated.id ? updated : d));
  };

  const addPerson = async () => {
    const name = newName.trim();
    if (!name) return;
    const existing = driversRaw.find(d => d.name === name);
    if (existing) {
      if (!existing[team]) await setMembership(existing, 1);
      setNewName("");
      return;
    }
    const res = await fetch("/api/drivers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, is_driver: team === "is_driver" ? 1 : 0, is_warehouse: team === "is_warehouse" ? 1 : 0 })
    });
    const created = await res.json();
    setDriversRaw(prev => [...prev, created].sort((a, b) => a.name.localeCompare(b.name)));
    setNewName("");
  };

  const removeFromTeam = async person => {
    if (person[otherTeam]) {
      await setMembership(person, 0);
      return;
    }
    await fetch(`/api/drivers/${person.id}`, { method: "DELETE" });
    setDriversRaw(prev => prev.filter(d => d.id !== person.id));
    setVacations(prev => prev.filter(v => v.driver_name !== person.name));
  };

  return React.createElement("div", { className: "no-print", style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px", marginTop: "16px", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" } },
    React.createElement("span", { style: { fontSize: "12.5px", color: "#5A6472", flexShrink: 0 } }, label),
    members.map(person => React.createElement("span", { key: person.id, className: "rr-driver-chip", title: person[otherTeam] ? `Werkt ook in ${otherLabel}` : undefined, style: { display: "inline-flex", alignItems: "center", gap: "6px", background: "#F3F8F3", border: "1px solid #DCE5DC", borderRadius: "14px", padding: "3px 10px", fontSize: "13px" } },
      onPersonClick
        ? React.createElement("span", { className: "rr-person-name", onClick: () => onPersonClick(person), title: "Standaardrooster instellen", style: { cursor: "pointer" } }, person.name)
        : person.name,
      person[otherTeam] ? React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0" } }, `+ ${otherLabel}`) : null,
      React.createElement("span", { className: "rr-driver-x", onClick: () => removeFromTeam(person), title: person[otherTeam] ? `${person.name} uit dit team halen (blijft in ${otherLabel})` : `${person.name} verwijderen`, style: { color: "#A9433F", fontSize: "12px" } }, "×")
    )),
    React.createElement("span", { style: { display: "inline-flex", alignItems: "center", gap: "4px", marginLeft: "4px" } },
      React.createElement("input", { className: "rr-input", style: { width: "110px", borderBottom: "1px solid #C9CDD3", padding: "3px 2px" }, value: newName, placeholder: "nieuwe naam", onChange: e => setNewName(e.target.value), onKeyDown: e => e.key === "Enter" && addPerson() }),
      React.createElement("button", { onClick: addPerson, style: { border: "1px solid #C9CDD3", background: "transparent", borderRadius: "5px", padding: "3px 9px", fontSize: "12.5px", color: "#1B2A4A", cursor: "pointer" } }, "+ toevoegen")
    ),
    linkable.length > 0 && React.createElement("select", {
      value: "",
      onChange: e => { const person = linkable.find(d => String(d.id) === e.target.value); if (person) setMembership(person, 1); },
      style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 6px", background: "#FFFFFF", color: "#1B2A4A" }
    },
      React.createElement("option", { value: "" }, `+ iemand uit ${otherLabel} toevoegen`),
      linkable.map(d => React.createElement("option", { key: d.id, value: d.id }, d.name))
    )
  );
}

// Rechtsklikmenu op een roostercel om iemand die dag (niet) beschikbaar te maken
function UnavailableMenu({ menu, onClose, driverIdByName, vacations, setVacations }) {
  if (!menu) return null;

  const toggleUnavailable = async (driverName, isoDate) => {
    const existing = vacations.find(v => v.driver_name === driverName && v.type === "unavailable" && v.start_date === isoDate && v.end_date === isoDate);
    if (existing) {
      await fetch(`/api/vacations/${existing.id}`, { method: "DELETE" });
      setVacations(prev => prev.filter(v => v.id !== existing.id));
      return;
    }
    const driver_id = driverIdByName[driverName];
    const res = await fetch("/api/vacations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driver_id, start_date: isoDate, end_date: isoDate, type: "unavailable" })
    });
    const created = await res.json();
    setVacations(prev => [...prev, { ...created, driver_name: driverName }]);
  };

  return React.createElement("div", { className: "no-print", onClick: onClose, onContextMenu: e => { e.preventDefault(); onClose(); }, style: { position: "fixed", inset: 0, zIndex: 100 } },
    React.createElement("div", { onClick: e => e.stopPropagation(), style: { position: "fixed", top: menu.y, left: menu.x, background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "6px", boxShadow: "0 4px 12px rgba(0,0,0,0.15)", padding: "4px", zIndex: 101, minWidth: "170px" } },
      React.createElement("div", {
        onClick: () => { toggleUnavailable(menu.driverName, menu.isoDate); onClose(); },
        onMouseEnter: e => { e.currentTarget.style.background = "#F3F8F3"; },
        onMouseLeave: e => { e.currentTarget.style.background = "transparent"; },
        style: { padding: "6px 10px", fontSize: "13px", color: "#1B2A4A", cursor: "pointer", borderRadius: "4px" }
      }, menu.isUnavailable ? "Weer beschikbaar maken" : "Niet beschikbaar")
    )
  );
}

function RouteRooster({ weekOffset, setWeekOffset, driversRaw, setDriversRaw, vacations, setVacations }) {
  const [rawRoutes, setRawRoutes] = useState([]);
  const [warehouseShifts, setWarehouseShifts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [contextMenu, setContextMenu] = useState(null);

  const drivers = driversRaw.filter(d => d.is_driver).map(d => d.name);
  const driverIdByName = Object.fromEntries(driversRaw.map(d => [d.name, d.id]));
  const currentMonday = addWeeks(getMondayOfThisWeek(), weekOffset);
  const currentKey = weekKey(currentMonday);
  const days = groupRoutesByDay(currentMonday, rawRoutes);
  const currentFriday = new Date(currentMonday);
  currentFriday.setDate(currentMonday.getDate() + 4);
  const weekLabel = `${formatDayDate(currentMonday)} – ${formatDayDate(currentFriday)}`;

  useEffect(() => {
    let cancelled = false;
    async function loadWeek() {
      setLoading(true);
      const res = await fetch(`/api/routes?week_key=${currentKey}`);
      let routes = await res.json();
      if (routes.length === 0) {
        for (let i = 0; i < SEED_ROUTES_PER_DAY.length; i++) {
          for (const r of SEED_ROUTES_PER_DAY[i]) {
            await fetch("/api/routes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ week_key: currentKey, day_index: i, code: r.code })
            });
          }
        }
        const res2 = await fetch(`/api/routes?week_key=${currentKey}`);
        routes = await res2.json();
      }
      const routesWithFixed = routes.map(r => ({ ...r, fixed: isFixedRoute(r.day_index, r.code) }));
      if (!cancelled) { setRawRoutes(routesWithFixed); setLoading(false); }
    }
    loadWeek();
    fetch(`/api/warehouse-shifts?week_key=${currentKey}`).then(r => r.json()).then(rows => { if (!cancelled) setWarehouseShifts(rows); });
    return () => { cancelled = true; };
  }, [currentKey]);

  const isDriverOnVacation = (driverName, isoDate) => isOnVacation(vacations, driverName, isoDate);
  const isDriverUnavailable = (driverName, isoDate) => isUnavailable(vacations, driverName, isoDate);

  const addRoute = async dayIndex => {
    const res = await fetch("/api/routes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ week_key: currentKey, day_index: dayIndex, code: "" })
    });
    const created = await res.json();
    setRawRoutes(prev => [...prev, { ...created, driver_name: null, fixed: false }]);
  };

  const removeRoute = async routeId => {
    await fetch(`/api/routes/${routeId}`, { method: "DELETE" });
    setRawRoutes(prev => prev.filter(r => r.id !== routeId));
  };

  const updateRoute = async (routeId, field, value) => {
    setRawRoutes(prev => prev.map(r => r.id === routeId ? (field === "driver" ? { ...r, driver_name: value || null } : { ...r, code: value }) : r));
    const body = field === "driver" ? { driver_id: value ? driverIdByName[value] : null } : { code: value };
    await fetch(`/api/routes/${routeId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  };

  const totalRoutes = days.reduce((sum, d) => sum + d.routes.length, 0);
  const isDriverInTeam = name => drivers.includes(name);
  const openRoutes = days.reduce((sum, d) => sum + d.routes.filter(r => !isDriverInTeam(r.driver)).length, 0);

  const driverDayRoutes = {};
  drivers.forEach(name => {
    driverDayRoutes[name] = {};
    days.forEach(day => { driverDayRoutes[name][day.dayIndex] = []; });
  });
  days.forEach(day => {
    day.routes.forEach(route => {
      if (route.driver && driverDayRoutes[route.driver]) {
        driverDayRoutes[route.driver][day.dayIndex].push(route);
      }
    });
  });
  const unassignedByDay = {};
  days.forEach(day => {
    unassignedByDay[day.dayIndex] = day.routes.filter(r => !isDriverInTeam(r.driver));
  });

  const isInWarehouse = (name, dayIndex) => {
    const id = driverIdByName[name];
    return driversRaw.some(d => d.id === id && d.is_warehouse) && warehouseShifts.some(w => w.driver_id === id && w.day_index === dayIndex);
  };

  const handleDropOnCell = (e, dayIndex, targetDriverName) => {
    e.preventDefault();
    let data;
    try { data = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (err) { return; }
    if (!data || data.dayIndex !== dayIndex) return;
    updateRoute(data.routeId, "driver", targetDriverName || "");
  };

  function renderRouteChip(route, day, driverName) {
    const isOnVac = driverName && isDriverOnVacation(driverName, day.isoDate);
    const warn = isOnVac;
    return React.createElement("div", {
      key: route.id,
      className: "rr-driver-cell",
      draggable: true,
      onDragStart: e => { e.dataTransfer.setData("text/plain", JSON.stringify({ routeId: route.id, dayIndex: day.dayIndex })); },
      style: { display: "flex", alignItems: "center", gap: "5px", padding: "4px 6px", marginBottom: "4px", borderRadius: "5px", border: `1px solid ${warn ? "#C0433D" : "#DCE5DC"}`, background: warn ? "#FBEAE9" : "#F3F8F3", cursor: "grab" }
    },
      React.createElement("input", { className: "rr-code-input", style: { fontSize: "12.5px", cursor: route.fixed ? "default" : "text" }, value: route.code, placeholder: "Routenaam", readOnly: route.fixed, onChange: e => updateRoute(route.id, "code", e.target.value) }),
      driverName && React.createElement("span", { className: "no-print", title: "Terug naar niet toegewezen", onClick: () => updateRoute(route.id, "driver", ""), style: { cursor: "pointer", color: "#8A93A0", fontSize: "12px", flexShrink: 0 } }, "↩"),
      !route.fixed && React.createElement("span", { className: "no-print", title: "Route verwijderen", onClick: () => removeRoute(route.id), style: { cursor: "pointer", color: "#A9433F", fontSize: "12px", flexShrink: 0 } }, "×")
    );
  }

  const gridChildren = [];
  gridChildren.push(React.createElement("div", { key: "hdr-empty" }, ""));
  days.forEach(day => gridChildren.push(
    React.createElement("div", { key: `hdr-${day.id}`, style: { fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: "12.5px", padding: "4px 2px" } }, day.name, " ", React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0", fontWeight: 400, fontFamily: "'IBM Plex Mono', monospace" } }, day.date))
  ));

    const totalUnassigned = days.reduce((sum, d) => sum + unassignedByDay[d.dayIndex].length, 0);
  const unassignedPrintClass = totalUnassigned === 0 ? "no-print" : "";
  gridChildren.push(React.createElement("div", { key: "unassigned-label", className: unassignedPrintClass, style: { fontSize: "12px", fontWeight: 600, color: "#5A6472", alignSelf: "flex-start", paddingTop: "6px" } }, "Niet toegewezen"));
  days.forEach(day => {
    const list = unassignedByDay[day.dayIndex];
    gridChildren.push(React.createElement("div", {
      key: `unassigned-${day.id}`,
      className: unassignedPrintClass,
      onDragOver: e => { e.preventDefault(); e.currentTarget.style.background = "#FBEDD0"; },

    let cancelled = false;

      setLoading(true);
      // Deze en toekomstige weken krijgen bij de eerste keer openen het standaardrooster
      if (currentKey >= weekKey(getMondayOfThisWeek())) {
        await fetch("/api/warehouse-shifts/apply-template", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ week_key: currentKey, only_if_new: true })

      }
      const loaded = await loadShifts();
      if (!cancelled) { setShifts(loaded); setLoading(false); }
    }
    loadWeek();
    fetch(`/api/routes?week_key=${currentKey}`).then(r => r.json()).then(rows => { if (!cancelled) setRoutes(rows); });

      method: "POST",

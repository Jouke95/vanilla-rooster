    const { useState, useEffect } = React;

// Alle serveraanroepen gaan via api(). Bij een fout verschijnt een melding (zie App);
// na een mislukte wijziging wordt alles opnieuw van de server geladen.
let onApiError = () => {};
async function api(url, options = {}) {
  const method = options.method || "GET";
  const init = options.body === undefined
    ? { method }
    : { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(options.body) };
  let res;
  try {
    res = await fetch(url, init);
  } catch (err) {
    throw reportApiError(method, "geen verbinding met de server");
  }
  if (res.status === 401) {
    // Sessie verlopen of uitgelogd: terug naar het inlogscherm, zonder foutmelding
    goToLogin();
    const err = new Error("niet ingelogd");
    err.reported = true;
    throw err;
  }
  if (!res.ok) {
    let message = `serverfout (${res.status})`;
    try { const data = await res.json(); if (data && data.error) message = data.error; } catch (err) {}
    throw reportApiError(method, message);
  }
  return res.status === 204 ? null : res.json();
}
function goToLogin() {
  window.location.href = "/login";
}
async function logout() {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  goToLogin();
}
function reportApiError(method, message) {
  const err = new Error(message);
  err.reported = true;
  onApiError({ saving: method !== "GET", message });
  return err;
}
// Fouten die al als melding getoond zijn niet nog eens in de console gooien
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.reported) e.preventDefault(); });

const DAY_NAMES = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag"];
function getMondayOfThisWeek() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  return monday;
}
function formatDayDate(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
}
function formatDayDateWithYear(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
}

const SEED_ROUTES_PER_DAY = [
  [
    { code: "We Supply" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "We Supply" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" }
  ],
  [
    { code: "Haarlem" },
    { code: "Noord-Holland" },
    { code: "'s Hertogenbosch" },
    { code: "Den Haag" },
    { code: "Rotterdam" },
    { code: "West Brabant" }
  ],
  [
    { code: "Oost 1" },
    { code: "Oost 2" },
    { code: "Oost Brabant" },
    { code: "'t Gooi" },
    { code: "Groene Hart" },
    { code: "Noord" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" },
    { code: "Zeeland" },
    { code: "Den Haag" },
    { code: "Rotterdam" }
  ]
];
function isFixedRoute(dayIndex, code) {
  return SEED_ROUTES_PER_DAY[dayIndex].some(r => r.code === code);
}

function weekKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addWeeks(date, n) { const d = new Date(date); d.setDate(d.getDate() + n * 7); return d; }
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

// Nederlandse feestdagen die op een werkdag kunnen vallen (zonder Goede Vrijdag en Bevrijdingsdag)
function getHolidays(year) {
  // Paasdatum volgens het algoritme van Meeus/Jones/Butcher
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const afterEaster = n => { const x = new Date(easter); x.setDate(easter.getDate() + n); return x; };
  const kingsDay = new Date(year, 3, 27);
  if (kingsDay.getDay() === 0) kingsDay.setDate(26);
  return {
    [weekKey(new Date(year, 0, 1))]: "Nieuwjaarsdag",
    [weekKey(afterEaster(1))]: "2e Paasdag",
    [weekKey(kingsDay)]: "Koningsdag",
    [weekKey(afterEaster(39))]: "Hemelvaartsdag",
    [weekKey(afterEaster(50))]: "2e Pinksterdag",
    [weekKey(new Date(year, 11, 25))]: "1e Kerstdag",
    [weekKey(new Date(year, 11, 26))]: "2e Kerstdag"
  };
}
function holidayName(isoDate) {
  return getHolidays(Number(isoDate.slice(0, 4)))[isoDate] || null;
}

function dayHeader(day) {
  return React.createElement("div", { key: `hdr-${day.id}`, style: { fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: "12.5px", padding: "4px 2px" } },
    day.name, " ", React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0", fontWeight: 400, fontFamily: "'IBM Plex Mono', monospace" } }, day.date),
    day.holiday && React.createElement("div", { className: "rr-holiday-label", style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, color: "#9A5B0B", background: "#FDF1DC", border: "1px solid #E8C58A", borderRadius: "4px", padding: "1px 6px", marginTop: "3px", display: "inline-block" } }, day.holiday)
  );
}

function groupRoutesByDay(monday, rawRoutes) {
  return DAY_NAMES.map((name, i) => {
    const dateObj = new Date(monday);
    dateObj.setDate(monday.getDate() + i);
    return {
      id: `day-${i}`,
      dayIndex: i,
      name,
      date: formatDayDate(dateObj),
      isoDate: weekKey(dateObj),
      holiday: holidayName(weekKey(dateObj)),
      routes: rawRoutes.filter(r => r.day_index === i).map(r => ({ id: r.id, code: r.code, driver: r.driver_name || "", fixed: r.fixed }))
    };
  });
}

// Soorten afwezigheid (kolom type in vacations) met hun tekst en kleuren in het rooster
const ABSENCE = {
  sick: { label: "Ziek", color: "#8E2A25", background: "#F8D7D4", border: "#C0433D" },
  vacation: { label: "Vakantie/vrij", color: "#4B2E7A", background: "#F1EAFB", border: "#C9B6E8" },
  unavailable: { label: "Niet beschikbaar", color: "#B0524E", background: "#FBEEED", border: "#E3B5B2" }
};

// Soort afwezigheid van iemand op een dag, of null. Ziek gaat voor vakantie, vakantie voor niet beschikbaar.
function absenceOn(vacations, driverName, isoDate) {
  const types = vacations.filter(v => v.driver_name === driverName && isoDate >= v.start_date && isoDate <= v.end_date).map(v => v.type || "vacation");
  return ["sick", "vacation", "unavailable"].find(t => types.includes(t)) || null;
}

// Label in een roostercel als iemand die dag ook in het andere rooster staat; oranje bij dubbele inplanning
function CrossLabel({ warn, children }) {
  return React.createElement("div", { title: warn ? "Dubbel ingepland: rijdt én magazijn" : undefined, style: { fontSize: "11px", fontWeight: 600, color: warn ? "#A9433F" : "#8A93A0", background: warn ? "#FBEDE0" : "transparent", border: warn ? "1px solid #E8A33D" : "1px solid transparent", borderRadius: "4px", padding: "1px 5px", marginBottom: "3px", textAlign: "center" } }, warn ? "⚠ " : "", children);
}

function VacationPanel({ teamNames, driverIdByName, vacations, setVacations, onRoutesChanged }) {
  const [vacDriver, setVacDriver] = useState("");
  const [vacType, setVacType] = useState("vacation");
  const [vacStart, setVacStart] = useState("");
  const [vacEnd, setVacEnd] = useState("");

  useEffect(() => {
    if (!teamNames.includes(vacDriver) && teamNames.length > 0) setVacDriver(teamNames[0]);
  }, [teamNames.join("|")]);

  const addVacation = async () => {
    if (!vacDriver || !vacStart || !vacEnd || vacStart > vacEnd) return;
    const driver_id = driverIdByName[vacDriver];
    const created = await api("/api/vacations", { method: "POST", body: { driver_id, start_date: vacStart, end_date: vacEnd, type: vacType } });
    setVacations(prev => [...prev, { ...created, driver_name: vacDriver }]);
    setVacStart(""); setVacEnd("");
    if (created.unassigned > 0 && onRoutesChanged) onRoutesChanged();
  };

  const removeVacation = async id => {
    await api(`/api/vacations/${id}`, { method: "DELETE" });
    setVacations(prev => prev.filter(v => v.id !== id));
  };

  const vacationsByDriver = {};
  vacations.filter(v => v.type !== "unavailable" && teamNames.includes(v.driver_name)).forEach(v => {  // vakantie en ziek
    if (!vacationsByDriver[v.driver_name]) vacationsByDriver[v.driver_name] = [];
    vacationsByDriver[v.driver_name].push(v);
  });
  const sortedVacationDriverNames = Object.keys(vacationsByDriver).sort((a, b) => a.localeCompare(b));
  sortedVacationDriverNames.forEach(name => {
    vacationsByDriver[name].sort((a, b) => a.start_date.localeCompare(b.start_date));
  });

  return React.createElement("div", { style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px" } },
    React.createElement("div", { style: { fontSize: "13px", fontWeight: 600, color: "#5A6472", marginBottom: "8px" } }, "Vakantie / ziek"),
    React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px" } },
      React.createElement("div", { style: { display: "flex", gap: "6px" } },
        React.createElement("select", { value: vacDriver, onChange: e => setVacDriver(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "13px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "4px 6px", background: "#FFFFFF", color: "#1B2A4A", flex: 1, minWidth: 0 } },
          teamNames.map(name => React.createElement("option", { key: name, value: name }, name))
        ),
        React.createElement("select", { className: "rr-vac-type", value: vacType, onChange: e => setVacType(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "13px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "4px 6px", background: "#FFFFFF", color: "#1B2A4A" } },
          React.createElement("option", { value: "vacation" }, "Vakantie/vrij"),
          React.createElement("option", { value: "sick" }, "Ziek")
        )
      ),
      React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "6px" } },
        React.createElement("input", { type: "date", value: vacStart, onChange: e => setVacStart(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } }),
        React.createElement("span", { style: { color: "#8A93A0", fontSize: "12px" } }, "t/m"),
        React.createElement("input", { type: "date", value: vacEnd, onChange: e => setVacEnd(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } })
      ),
      React.createElement("button", { className: "rr-vac-add-btn", onClick: addVacation, style: { width: "100%", border: "1px solid #1B2A4A", background: "#1B2A4A", color: "#FFFFFF", borderRadius: "5px", padding: "6px 9px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer", marginTop: "2px" } }, "Toevoegen")
    ),
    sortedVacationDriverNames.length > 0 && React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "10px" } },
      sortedVacationDriverNames.map(name => React.createElement("div", { key: name },
        React.createElement("div", { style: { fontSize: "12px", fontWeight: 600, color: "#5A6472", marginBottom: "4px" } }, name),
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "4px" } },
          vacationsByDriver[name].map(v => {
            const isSameDay = v.start_date === v.end_date;
            const label = isSameDay
              ? formatDayDateWithYear(new Date(v.start_date))
              : `${formatDayDateWithYear(new Date(v.start_date))} – ${formatDayDateWithYear(new Date(v.end_date))}`;
            const sick = v.type === "sick";
            return React.createElement("div", { key: v.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "6px", background: sick ? ABSENCE.sick.background : "#FBEDE0", border: `1px solid ${sick ? ABSENCE.sick.border : "#E8A33D"}`, borderRadius: "6px", padding: "4px 8px", fontSize: "12px", color: sick ? ABSENCE.sick.color : "#7A3B10" } },
              React.createElement("span", null, sick ? React.createElement("strong", null, "Ziek ") : null, label),
              React.createElement("span", { onClick: () => { if (window.confirm(`${sick ? "Ziekmelding" : "Vakantie"} van ${name} verwijderen?`)) removeVacation(v.id); }, title: "Verwijderen", style: { cursor: "pointer", color: "#A9433F", flexShrink: 0 } }, "×")
            );
          })
        )
      ))
    )
  );
}

// team is "is_driver" of "is_warehouse"; iemand die uit zijn laatste team wordt gehaald, wordt helemaal verwijderd
function PeopleBar({ team, label, otherLabel, driversRaw, setDriversRaw, setVacations, onPersonClick }) {
  const [newName, setNewName] = useState("");
  const otherTeam = team === "is_driver" ? "is_warehouse" : "is_driver";
  const members = driversRaw.filter(d => d[team]);
  const linkable = driversRaw.filter(d => !d[team] && d[otherTeam]).sort((a, b) => a.name.localeCompare(b.name));

  const setMembership = async (person, value) => {
    const updated = await api(`/api/drivers/${person.id}`, { method: "PATCH", body: { [team]: value } });
    setDriversRaw(prev => prev.map(d => d.id === updated.id ? updated : d));
  };

  const addPerson = async () => {
    const name = newName.trim();
    if (!name) return;
    const existing = driversRaw.find(d => d.name === name);
    if (existing) {
      if (!existing[team]) await setMembership(existing, 1);
      setNewName("");
      return;
    }
    const created = await api("/api/drivers", { method: "POST", body: { name, is_driver: team === "is_driver" ? 1 : 0, is_warehouse: team === "is_warehouse" ? 1 : 0 } });
    setDriversRaw(prev => [...prev, created].sort((a, b) => a.name.localeCompare(b.name)));
    setNewName("");
  };

  const removeFromTeam = async person => {
    if (person[otherTeam]) {
      await setMembership(person, 0);
      return;
    }
    await api(`/api/drivers/${person.id}`, { method: "DELETE" });
    setDriversRaw(prev => prev.filter(d => d.id !== person.id));
    setVacations(prev => prev.filter(v => v.driver_name !== person.name));
  };

  return React.createElement("div", { className: "no-print", style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px", marginTop: "16px", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" } },
    React.createElement("span", { style: { fontSize: "12.5px", color: "#5A6472", flexShrink: 0 } }, label),
    members.map(person => React.createElement("span", { key: person.id, className: "rr-driver-chip", title: person[otherTeam] ? `Werkt ook in ${otherLabel}` : undefined, style: { display: "inline-flex", alignItems: "center", gap: "6px", background: "#F3F8F3", border: "1px solid #DCE5DC", borderRadius: "14px", padding: "3px 10px", fontSize: "13px" } },
      onPersonClick
        ? React.createElement("span", { className: "rr-person-name", onClick: () => onPersonClick(person), title: "Standaardrooster instellen", style: { cursor: "pointer" } }, person.name)
        : person.name,
      person[otherTeam] ? React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0" } }, `+ ${otherLabel}`) : null,
      React.createElement("span", { className: "rr-driver-x", onClick: () => removeFromTeam(person), title: person[otherTeam] ? `${person.name} uit dit team halen (blijft in ${otherLabel})` : `${person.name} verwijderen`, style: { color: "#A9433F", fontSize: "12px" } }, "×")
    )),
    React.createElement("span", { style: { display: "inline-flex", alignItems: "center", gap: "4px", marginLeft: "4px" } },
      React.createElement("input", { className: "rr-input", style: { width: "110px", borderBottom: "1px solid #C9CDD3", padding: "3px 2px" }, value: newName, placeholder: "nieuwe naam", onChange: e => setNewName(e.target.value), onKeyDown: e => e.key === "Enter" && addPerson() }),
      React.createElement("button", { onClick: addPerson, style: { border: "1px solid #C9CDD3", background: "transparent", borderRadius: "5px", padding: "3px 9px", fontSize: "12.5px", color: "#1B2A4A", cursor: "pointer" } }, "+ toevoegen")
    ),
    linkable.length > 0 && React.createElement("select", {
      value: "",
      onChange: e => { const person = linkable.find(d => String(d.id) === e.target.value); if (person) setMembership(person, 1); },
      style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 6px", background: "#FFFFFF", color: "#1B2A4A" }
    },
      React.createElement("option", { value: "" }, `+ iemand uit ${otherLabel} toevoegen`),
      linkable.map(d => React.createElement("option", { key: d.id, value: d.id }, d.name))
    )
  );
}

// Rechtsklikmenu op een roostercel: iemand die dag niet beschikbaar of ziek melden, of dat weer ongedaan maken
function UnavailableMenu({ menu, onClose, driverIdByName, vacations, setVacations, onRoutesChanged }) {
  if (!menu) return null;

  const singleDay = type => vacations.find(v => v.driver_name === menu.driverName && v.type === type && v.start_date === menu.isoDate && v.end_date === menu.isoDate);

  const toggle = async type => {
    const existing = singleDay(type);
    if (existing) {
      await api(`/api/vacations/${existing.id}`, { method: "DELETE" });
      setVacations(prev => prev.filter(v => v.id !== existing.id));
      return;
    }
    const driver_id = driverIdByName[menu.driverName];
    const created = await api("/api/vacations", { method: "POST", body: { driver_id, start_date: menu.isoDate, end_date: menu.isoDate, type } });
    setVacations(prev => [...prev, { ...created, driver_name: menu.driverName }]);
    if (created.unassigned > 0 && onRoutesChanged) onRoutesChanged();
  };

  const item = (type, label) => React.createElement("div", {
    key: type,
    onClick: () => { toggle(type); onClose(); },
    onMouseEnter: e => { e.currentTarget.style.background = "#F3F8F3"; },
    onMouseLeave: e => { e.currentTarget.style.background = "transparent"; },
    style: { padding: "6px 10px", fontSize: "13px", color: "#1B2A4A", cursor: "pointer", borderRadius: "4px" }
  }, label);

  return React.createElement("div", { className: "no-print", onClick: onClose, onContextMenu: e => { e.preventDefault(); onClose(); }, style: { position: "fixed", inset: 0, zIndex: 100 } },
    React.createElement("div", { onClick: e => e.stopPropagation(), style: { position: "fixed", top: menu.y, left: menu.x, background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "6px", boxShadow: "0 4px 12px rgba(0,0,0,0.15)", padding: "4px", zIndex: 101, minWidth: "170px" } },
      item("unavailable", singleDay("unavailable") ? "Weer beschikbaar maken" : "Niet beschikbaar"),
      item("sick", singleDay("sick") ? "Niet meer ziek" : "Ziek (deze dag)")
    )
  );
}

function RouteRooster({ weekOffset, setWeekOffset, driversRaw, setDriversRaw, vacations, setVacations, reloadKey }) {
  const [rawRoutes, setRawRoutes] = useState([]);
  const [routeTemplates, setRouteTemplates] = useState([]);
  const [templatePerson, setTemplatePerson] = useState(null);
  const [warehouseShifts, setWarehouseShifts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [contextMenu, setContextMenu] = useState(null);

  const drivers = driversRaw.filter(d => d.is_driver).map(d => d.name);
  const driverIdByName = Object.fromEntries(driversRaw.map(d => [d.name, d.id]));
  const currentMonday = addWeeks(getMondayOfThisWeek(), weekOffset);
  const currentKey = weekKey(currentMonday);
  const days = groupRoutesByDay(currentMonday, rawRoutes);
  const holidayDays = days.filter(d => d.holiday).map(d => d.dayIndex);
  const currentFriday = new Date(currentMonday);
  currentFriday.setDate(currentMonday.getDate() + 4);
  const weekLabel = `${formatDayDate(currentMonday)} – ${formatDayDate(currentFriday)}`;

  useEffect(() => {
    let cancelled = false;
    async function loadWeek() {
      setLoading(true);
      let routes = await api(`/api/routes?week_key=${currentKey}`);
      if (routes.length === 0) {
        for (let i = 0; i < SEED_ROUTES_PER_DAY.length; i++) {
          for (const r of SEED_ROUTES_PER_DAY[i]) {
            await api("/api/routes", { method: "POST", body: { week_key: currentKey, day_index: i, code: r.code } });
          }
        }
        await api("/api/routes/apply-template", { method: "POST", body: { week_key: currentKey, skip_days: holidayDays } });
        routes = await api(`/api/routes?week_key=${currentKey}`);
      }
      const routesWithFixed = routes.map(r => ({ ...r, fixed: isFixedRoute(r.day_index, r.code) }));
      if (!cancelled) { setRawRoutes(routesWithFixed); setLoading(false); }
    }
    loadWeek();
    api("/api/route-templates").then(rows => { if (!cancelled) setRouteTemplates(rows); });

      onSave: (start, end) => { saveShift(editor.person, editor.day, start, end); setEditor(null); },
      onRemove: () => { removeShift(editor.person, editor.day); setEditor(null); }
    }),
    templatePerson && React.createElement(TemplateModal, { person: templatePerson, templates, weekLabel, onSave: (days, applyToWeek) => saveTemplate(templatePerson, days, applyToWeek), onClose: () => setTemplatePerson(null) })
  );
}

// Printversie met chauffeurs en magazijn in één tabel. Alleen zichtbaar bij printen.
function CombinedPrint({ weekOffset, driversRaw, vacations, onDone }) {
  const [data, setData] = useState(null);
  const monday = addWeeks(getMondayOfThisWeek(), weekOffset);
  const key = weekKey(monday);
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  const days = groupRoutesByDay(monday, []);

  useEffect(() => {
    Promise.all([
      api(`/api/routes?week_key=${key}`),
      api(`/api/warehouse-shifts?week_key=${key}`)
    ]).then(([routes, shifts]) => setData({ routes, shifts }), onDone);
  }, [key]);

  useEffect(() => {
    if (!data) return;
    const timer = setTimeout(() => { window.print(); onDone(); }, 0);
    return () => clearTimeout(timer);
  }, [data]);

  if (!data) return null;

  const byName = (a, b) => a.name.localeCompare(b.name);
  const drivers = driversRaw.filter(d => d.is_driver).sort(byName);
  const warehouse = driversRaw.filter(d => d.is_warehouse).sort(byName);
  const driverIds = new Set(drivers.map(d => d.id));
  const shiftText = shift => shift.start_time ? `${shift.start_time}–${shift.end_time}` : "werkt";

  // section is "driver" (alleen routes) of "warehouse" (alleen magazijntijden); iemand in beide teams staat in beide groepen
  const cellContent = (person, day, section) => {
    const away = absenceOn(vacations, person.name, day.isoDate);
    if (away) return React.createElement("span", { style: { color: ABSENCE[away].color, fontWeight: 600 } }, ABSENCE[away].label);
    const lines = [];
    if (section === "driver") {
      data.routes.filter(r => r.driver_id === person.id && r.day_index === day.dayIndex)
        .forEach(r => lines.push(React.createElement("div", { key: `r-${r.id}`, style: { fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 } }, r.code || "route")));
    }
    const shift = section === "warehouse" && data.shifts.find(s => s.driver_id === person.id && s.day_index === day.dayIndex);
    if (shift) {
      lines.push(React.createElement("div", { key: "mag", style: { fontFamily: "'IBM Plex Mono', monospace", color: "#2F6B3A", fontWeight: 600 } }, shiftText(shift)));
    }
    return lines;
  };

  const cellStyle = { border: "1px solid #D5D9DE", padding: "3px 5px", fontSize: "10.5px", verticalAlign: "top" };
  const nameStyle = { ...cellStyle, fontWeight: 600, whiteSpace: "nowrap" };
  const personRow = section => person => React.createElement("tr", { key: `${section}-${person.id}` },
    React.createElement("td", { style: nameStyle }, person.name),
    days.map(day => React.createElement("td", { key: day.id, style: cellStyle }, cellContent(person, day, section)))
  );
  const sectionRow = label => React.createElement("tr", { key: `section-${label}` },
    React.createElement("td", { colSpan: 6, style: { padding: "8px 5px 3px", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: "12px", borderBottom: "2px solid #1B2A4A" } }, label)
  );

  const unassignedByDay = days.map(day => data.routes.filter(r => r.day_index === day.dayIndex && !driverIds.has(r.driver_id)));
  const hasUnassigned = unassignedByDay.some(list => list.length > 0);

  return React.createElement("div", { className: "rr-print-only", style: { fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1B2A4A", padding: "6px" } },
    React.createElement("style", null, `
      .rr-print-only { display: none; }
      @media print {
        .no-print { display: none !important; }
        .rr-print-only { display: block !important; }
        body, html, #root { background: #fff !important; min-height: auto !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .rr-print-only tr { break-inside: avoid; }
      }
    `),
    React.createElement("h1", { style: { fontFamily: "'Space Grotesk', sans-serif", fontSize: "18px", fontWeight: 700, margin: "0 0 8px" } },
      `Weekrooster week ${getISOWeekNumber(monday)} · ${formatDayDate(monday)} – ${formatDayDate(friday)}`),
    React.createElement("table", { style: { width: "100%", borderCollapse: "collapse", tableLayout: "fixed" } },
      React.createElement("colgroup", null,
        React.createElement("col", { style: { width: "90px" } }),
        days.map(day => React.createElement("col", { key: day.id }))
      ),
      React.createElement("thead", null,
        React.createElement("tr", null,
          React.createElement("th", { style: { ...cellStyle, border: "none" } }),
          days.map(day => React.createElement("th", { key: day.id, style: { ...cellStyle, border: "none", textAlign: "left", fontFamily: "'Space Grotesk', sans-serif", fontSize: "11.5px" } }, `${day.name} `, React.createElement("span", { style: { fontWeight: 400, color: "#8A93A0" } }, day.date), day.holiday && React.createElement("div", { style: { color: "#9A5B0B", fontSize: "10px" } }, day.holiday)))
        )
      ),
      React.createElement("tbody", null,
        drivers.length > 0 && sectionRow("Chauffeurs"),
        drivers.map(personRow("driver")),
        hasUnassigned && React.createElement("tr", { key: "unassigned" },
          React.createElement("td", { style: { ...nameStyle, color: "#A9433F" } }, "Niet toegewezen"),
          days.map((day, i) => React.createElement("td", { key: day.id, style: { ...cellStyle, background: "#FDF6EC" } },
            unassignedByDay[i].map(r => React.createElement("div", { key: r.id, style: { fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 } }, r.code || "route"))
          ))
        ),
        warehouse.length > 0 && sectionRow("Magazijn"),
        warehouse.map(personRow("warehouse"))
      )
    )
  );
}

function App() {
  const [tab, setTab] = useState("chauffeurs");
  const [weekOffset, setWeekOffset] = useState(0);
  const [driversRaw, setDriversRaw] = useState([]);
  const [vacations, setVacations] = useState([]);
  const [combinedPrint, setCombinedPrint] = useState(false);
  const [apiError, setApiError] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    onApiError = error => {
      // Een melding over niet-opgeslagen werk niet laten overschrijven door een laadfout
      setApiError(prev => (prev && prev.saving && !error.saving) ? prev : error);
      if (error.saving) setReloadKey(k => k + 1);
    };
  }, []);

  useEffect(() => {
    api("/api/drivers").then(setDriversRaw);
    api("/api/vacations").then(setVacations);
  }, [reloadKey]);

  const shared = { weekOffset, setWeekOffset, driversRaw, setDriversRaw, vacations, setVacations, reloadKey };
  const tabButton = (id, label) => React.createElement("button", {
    key: id,
    onClick: () => setTab(id),
    style: { border: "1px solid #C9CDD3", borderBottom: tab === id ? "1px solid #EDF0F2" : "1px solid #C9CDD3", background: tab === id ? "#EDF0F2" : "#E1E5E9", color: tab === id ? "#1B2A4A" : "#5A6472", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: "13.5px", padding: "8px 18px", borderRadius: "8px 8px 0 0", marginBottom: "-1px", cursor: "pointer" }
  }, label);

  return React.createElement("div", { style: { minHeight: "100%", background: "#EDF0F2" } },
    React.createElement("div", { className: "no-print", style: { display: "flex", gap: "4px", padding: "14px 20px 0", borderBottom: "1px solid #C9CDD3", fontFamily: "'IBM Plex Sans', system-ui, sans-serif" } },
      tabButton("chauffeurs", "Chauffeurs"),
      tabButton("magazijn", "Magazijn"),
      React.createElement("button", { onClick: () => setCombinedPrint(true), disabled: combinedPrint, style: { marginLeft: "auto", alignSelf: "center", marginBottom: "6px", border: "1px solid #1B2A4A", background: "#1B2A4A", color: "#FFFFFF", borderRadius: "6px", padding: "6px 14px", fontSize: "13px", cursor: combinedPrint ? "wait" : "pointer" } }, "Print chauffeurs + magazijn"),
      React.createElement("button", { onClick: logout, style: { alignSelf: "center", marginBottom: "6px", border: "1px solid #C9CDD3", background: "#FFFFFF", color: "#1B2A4A", borderRadius: "6px", padding: "6px 12px", fontSize: "13px", cursor: "pointer" } }, "Uitloggen")
    ),
    React.createElement("div", { className: combinedPrint ? "no-print" : "" },
      tab === "chauffeurs"
        ? React.createElement(RouteRooster, shared)
        : React.createElement(WarehouseRooster, shared)
    ),
    apiError && React.createElement("div", { className: "no-print", role: "alert", style: { position: "fixed", top: "12px", left: "50%", transform: "translateX(-50%)", zIndex: 200, width: "min(560px, calc(100% - 32px))", boxSizing: "border-box", display: "flex", alignItems: "flex-start", gap: "10px", background: "#FBEAE9", border: "1px solid #C0433D", borderRadius: "8px", boxShadow: "0 4px 12px rgba(0,0,0,0.15)", padding: "10px 14px", fontFamily: "'IBM Plex Sans', system-ui, sans-serif", fontSize: "13px", color: "#7A1F1B" } },
      React.createElement("div", { style: { flex: 1 } },
        React.createElement("div", { style: { fontWeight: 600 } }, apiError.saving ? `Niet opgeslagen: ${apiError.message}` : `Kon gegevens niet laden: ${apiError.message}`),
        React.createElement("div", { style: { marginTop: "2px", color: "#9A3A35" } }, apiError.saving
          ? "Het rooster is opnieuw geladen van de server. Controleer je laatste wijziging en probeer het opnieuw."
          : "Controleer of de server draait en ververs de pagina.")
      ),
      React.createElement("span", { onClick: () => setApiError(null), title: "Sluiten", style: { cursor: "pointer", fontSize: "16px", lineHeight: 1, color: "#A9433F" } }, "×")
    ),
    combinedPrint && React.createElement(CombinedPrint, { weekOffset, driversRaw, vacations, onDone: () => setCombinedPrint(false) })
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>

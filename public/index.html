// Alle serveraanroepen gaan via api(). Bij een fout verschijnt een melding (zie App);
// na een mislukte wijziging wordt alles opnieuw van de server geladen.
let onApiError = () => {};
async function api(url, options = {}) {
  const method = options.method || "GET";
  const init = options.body === undefined
    ? { method }
    : { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(options.body) };
  let res;
  try {
    res = await fetch(url, init);
  } catch (err) {
    throw reportApiError(method, "geen verbinding met de server", options.loading);
  }
  if (res.status === 401) {
    // Sessie verlopen of uitgelogd: terug naar het inlogscherm, zonder foutmelding
    goToLogin();
    const err = new Error("niet ingelogd");
    err.reported = true;
    throw err;
  }
  if (!res.ok) {
    let message = `serverfout (${res.status})`;
    try { const data = await res.json(); if (data && data.error) message = data.error; } catch (err) {}
    throw reportApiError(method, message, options.loading);
  }
  return res.status === 204 ? null : res.json();
}
function goToLogin() {
  window.location.href = "/login";
}
async function logout() {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  goToLogin();
}
// loading: een POST die alleen dient om gegevens te laden (week openen) telt als laden, niet als opslaan,
// zodat een fout geen herlaadlus geeft
function reportApiError(method, message, loading) {
  const err = new Error(message);
  err.reported = true;
  onApiError({ saving: method !== "GET" && !loading, message });
  return err;
}
// Fouten die al als melding getoond zijn niet nog eens in de console gooien
window.addEventListener("unhandledrejection", e => { if (e.reason && e.reason.reported) e.preventDefault(); });

function getMondayOfThisWeek() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  return monday;
}
function formatDayDate(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
}
function formatDayDateWithYear(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
}

function weekKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addWeeks(date, n) { const d = new Date(date); d.setDate(d.getDate() + n * 7); return d; }
function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

// Nederlandse feestdagen die op een werkdag kunnen vallen (zonder Goede Vrijdag en Bevrijdingsdag)
function getHolidays(year) {
  // Paasdatum volgens het algoritme van Meeus/Jones/Butcher
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const afterEaster = n => { const x = new Date(easter); x.setDate(easter.getDate() + n); return x; };
  const kingsDay = new Date(year, 3, 27);
  if (kingsDay.getDay() === 0) kingsDay.setDate(26);
  return {
    [weekKey(new Date(year, 0, 1))]: "Nieuwjaarsdag",
    [weekKey(afterEaster(1))]: "2e Paasdag",
    [weekKey(kingsDay)]: "Koningsdag",
    [weekKey(afterEaster(39))]: "Hemelvaartsdag",
    [weekKey(afterEaster(50))]: "2e Pinksterdag",
    [weekKey(new Date(year, 11, 25))]: "1e Kerstdag",
    [weekKey(new Date(year, 11, 26))]: "2e Kerstdag"
  };
}
function holidayName(isoDate) {
  return getHolidays(Number(isoDate.slice(0, 4)))[isoDate] || null;
}

// Schuift het zijpaneel (Vakantie / ziek) omlaag tot waar het rooster begint: marge = hoogte van titel en
// weeknavigatie. Staat het paneel onder het rooster (smal scherm), dan geen marge.
function useSidePanelOffset() {
  const headerRef = useRef(null);
  const sideRef = useRef(null);
  const [offset, setOffset] = useState(0);
  useLayoutEffect(() => {
    const measure = () => {
      const header = headerRef.current, side = sideRef.current;
      if (!header || !side) return;
      const besideRooster = side.offsetLeft > header.offsetLeft + 50;
      const style = window.getComputedStyle(header);
      setOffset(besideRooster ? header.offsetHeight + parseFloat(style.marginBottom || 0) : 0);
    };
    measure();
    window.addEventListener("resize", measure);
    const observer = typeof ResizeObserver !== "undefined" ? new ResizeObserver(measure) : null;
    if (observer && headerRef.current) observer.observe(headerRef.current);
    return () => { window.removeEventListener("resize", measure); if (observer) observer.disconnect(); };
  }, []);
  return { headerRef, sideRef, offset };
}

// Weeknavigatie bovenaan elk tabblad: pijltjes met weeknummer en datums ertussen, en rechts "deze week" of
// een knop terug naar deze week (altijd iets op die plek, zodat er niets verspringt). Helemaal rechts het
// menu "⋯ Meer" met de acties van het tabblad.
function WeekNav({ weekOffset, setWeekOffset, monday, actions }) {
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  const sameMonth = monday.getMonth() === friday.getMonth();
  const otherYear = friday.getFullYear() !== new Date().getFullYear();
  const dates = `${sameMonth ? monday.getDate() : formatDayDate(monday)} – ${formatDayDate(friday)}${otherYear ? ` ${friday.getFullYear()}` : ""}`;
  const arrow = (label, delta, symbol) => React.createElement("button", {
    className: "rr-week-arrow", onClick: () => setWeekOffset(w => w + delta), title: label, "aria-label": label
  }, symbol);

  return React.createElement("div", { className: "rr-week-nav", style: { display: "flex", alignItems: "stretch", gap: "10px", marginTop: "12px" } },
    React.createElement("style", null, NAV_CSS),
    React.createElement("div", { className: "rr-week-box", style: { display: "inline-flex", alignItems: "stretch", background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", overflow: "hidden" } },

      ),

}

function groupRoutesByDay(monday, rawRoutes) {
  return DAY_NAMES.map((name, i) => {
    const dateObj = new Date(monday);
    dateObj.setDate(monday.getDate() + i);
    return {
      id: `day-${i}`,
      dayIndex: i,
      name,
      date: formatDayDate(dateObj),
      isoDate: weekKey(dateObj),
      holiday: holidayName(weekKey(dateObj)),
      routes: rawRoutes.filter(r => r.day_index === i).map(r => ({ id: r.id, code: r.code, driver: r.driver_name || "", fixed: r.fixed }))
    };
  });
}

// Soort afwezigheid van iemand op een dag, of null. Ziek gaat voor vakantie, vakantie voor niet beschikbaar.
function absenceOn(vacations, driverName, isoDate) {
  const types = vacations.filter(v => v.driver_name === driverName && isoDate >= v.start_date && isoDate <= v.end_date).map(v => v.type || "vacation");
  return ["sick", "vacation", "unavailable"].find(t => types.includes(t)) || null;
}

        React.createElement("input", { type: "date", value: vacStart, onChange: e => setVacStart(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } }),
        React.createElement("span", { style: { color: "#8A93A0", fontSize: "12px" } }, "t/m"),
        React.createElement("input", { type: "date", value: vacEnd, onChange: e => setVacEnd(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } })

// Alle teams, als kolom in de tabel drivers met de naam zoals die in labels staat
const TEAMS = [
  { column: "is_driver", name: "chauffeurs" },
  { column: "is_warehouse", name: "magazijn" },
  { column: "is_production", name: "productie" }
];

// team is een kolom uit TEAMS; iemand die uit zijn laatste team wordt gehaald, wordt helemaal verwijderd
function PeopleBar({ team, label, driversRaw, setDriversRaw, setVacations, onPersonClick }) {
  const [newName, setNewName] = useState("");
  const otherTeamsOf = person => TEAMS.filter(t => t.column !== team && person[t.column]).map(t => t.name);
  const members = driversRaw.filter(d => d[team]);
  const linkable = driversRaw.filter(d => !d[team] && otherTeamsOf(d).length > 0).sort((a, b) => a.name.localeCompare(b.name));

  const setMembership = async (person, value) => {
    const updated = await api(`/api/drivers/${person.id}`, { method: "PATCH", body: { [team]: value } });
    setDriversRaw(prev => prev.map(d => d.id === updated.id ? updated : d));
  };

  const addPerson = async () => {
    const name = newName.trim();
    if (!name) return;
    const existing = driversRaw.find(d => d.name === name);
    if (existing) {
      if (!existing[team]) await setMembership(existing, 1);
      setNewName("");
      return;
    }
    const created = await api("/api/drivers", { method: "POST", body: { name, ...Object.fromEntries(TEAMS.map(t => [t.column, t.column === team ? 1 : 0])) } });
    setDriversRaw(prev => [...prev, created].sort((a, b) => a.name.localeCompare(b.name)));
    setNewName("");
  };

  const removeFromTeam = async person => {
    if (otherTeamsOf(person).length > 0) {
      await setMembership(person, 0);
      return;
    }
    await api(`/api/drivers/${person.id}`, { method: "DELETE" });
    setDriversRaw(prev => prev.filter(d => d.id !== person.id));
    setVacations(prev => prev.filter(v => v.driver_name !== person.name));
  };

  return React.createElement("div", { className: "no-print", style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px", marginTop: "16px", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" } },
    React.createElement("span", { style: { fontSize: "12.5px", color: "#5A6472", flexShrink: 0 } }, label),
    members.map(person => { const others = otherTeamsOf(person).join(", "); return React.createElement("span", { key: person.id, className: "rr-driver-chip", title: others ? `Werkt ook in ${others}` : undefined, style: { display: "inline-flex", alignItems: "center", gap: "6px", background: "#F3F8F3", border: "1px solid #DCE5DC", borderRadius: "14px", padding: "3px 10px", fontSize: "13px" } },
      onPersonClick
        ? React.createElement("span", { className: "rr-person-name", onClick: () => onPersonClick(person), title: "Standaardrooster instellen", style: { cursor: "pointer" } }, person.name)
        : person.name,
      others ? React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0" } }, `+ ${others}`) : null,
      React.createElement("span", { className: "rr-driver-x", onClick: () => removeFromTeam(person), title: others ? `${person.name} uit dit team halen (blijft in ${others})` : `${person.name} verwijderen`, style: { color: "#A9433F", fontSize: "12px" } }, "×")
    ); }),
    React.createElement("span", { style: { display: "inline-flex", alignItems: "center", gap: "4px", marginLeft: "4px" } },
      React.createElement("input", { className: "rr-input", style: { width: "110px", borderBottom: "1px solid #C9CDD3", padding: "3px 2px" }, value: newName, placeholder: "nieuwe naam", onChange: e => setNewName(e.target.value), onKeyDown: e => e.key === "Enter" && addPerson() }),
      React.createElement("button", { onClick: addPerson, style: { border: "1px solid #C9CDD3", background: "transparent", borderRadius: "5px", padding: "3px 9px", fontSize: "12.5px", color: "#1B2A4A", cursor: "pointer" } }, "+ toevoegen")
    ),
    linkable.length > 0 && React.createElement("select", {
      value: "",
      onChange: e => { const person = linkable.find(d => String(d.id) === e.target.value); if (person) setMembership(person, 1); },
      style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 6px", background: "#FFFFFF", color: "#1B2A4A" }
    },
      React.createElement("option", { value: "" }, "+ iemand uit een ander team toevoegen"),
      linkable.map(d => React.createElement("option", { key: d.id, value: d.id, title: otherTeamsOf(d).join(", ") }, d.name))
    )
  );
}

// Rechtsklikmenu op een roostercel: iemand die dag niet beschikbaar of ziek melden, of dat weer ongedaan maken
function UnavailableMenu({ menu, onClose, driverIdByName, vacations, setVacations, onRoutesChanged }) {
  if (!menu) return null;

  const singleDay = type => vacations.find(v => v.driver_name === menu.driverName && v.type === type && v.start_date === menu.isoDate && v.end_date === menu.isoDate);

  const toggle = async type => {
    const existing = singleDay(type);
    if (existing) {
      await api(`/api/vacations/${existing.id}`, { method: "DELETE" });
      setVacations(prev => prev.filter(v => v.id !== existing.id));
      return;
    }
    const driver_id = driverIdByName[menu.driverName];
    const created = await api("/api/vacations", { method: "POST", body: { driver_id, start_date: menu.isoDate, end_date: menu.isoDate, type } });
    setVacations(prev => [...prev, { ...created, driver_name: menu.driverName }]);
    if (created.unassigned > 0 && onRoutesChanged) onRoutesChanged();
  };

  const item = (type, label) => React.createElement("div", {
    key: type,
    onClick: () => { toggle(type); onClose(); },
    onMouseEnter: e => { e.currentTarget.style.background = "#F3F8F3"; },
    onMouseLeave: e => { e.currentTarget.style.background = "transparent"; },
    style: { padding: "6px 10px", fontSize: "13px", color: "#1B2A4A", cursor: "pointer", borderRadius: "4px" }
  }, label);

  return React.createElement("div", { className: "no-print", onClick: onClose, onContextMenu: e => { e.preventDefault(); onClose(); }, style: { position: "fixed", inset: 0, zIndex: 100 } },
    React.createElement("div", { onClick: e => e.stopPropagation(), style: { position: "fixed", top: menu.y, left: menu.x, background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "6px", boxShadow: "0 4px 12px rgba(0,0,0,0.15)", padding: "4px", zIndex: 101, minWidth: "170px" } },
      item("unavailable", singleDay("unavailable") ? "Weer beschikbaar maken" : "Niet beschikbaar"),
      item("sick", singleDay("sick") ? "Niet meer ziek" : "Ziek (deze dag)")
    )
  );
}

function RouteRooster({ weekOffset, setWeekOffset, driversRaw, setDriversRaw, vacations, setVacations, reloadKey }) {
  const sidePanel = useSidePanelOffset();
  const [showHelp, setShowHelp] = useState(false);
  const [rawRoutes, setRawRoutes] = useState([]);
  const [routeTemplates, setRouteTemplates] = useState([]);
  const [templatePerson, setTemplatePerson] = useState(null);
  // TIJDELIJK: welke weergave voor meerdere routes (A of B), onthouden in deze browser
  const [multiStyle, setMultiStyleState] = useState(() => { try { return localStorage.getItem("rr-multi-style") === "B" ? "B" : "A"; } catch (err) { return "A"; } });
  const setMultiStyle = v => { setMultiStyleState(v); try { localStorage.setItem("rr-multi-style", v); } catch (err) {} };
  const [teamShifts, setTeamShifts] = useState({});  // per dienstenteam de diensten van deze week
  const [loading, setLoading] = useState(true);
  const [contextMenu, setContextMenu] = useState(null);

  const drivers = driversRaw.filter(d => d.is_driver).map(d => d.name);
  const driverIdByName = Object.fromEntries(driversRaw.map(d => [d.name, d.id]));
  const currentMonday = addWeeks(getMondayOfThisWeek(), weekOffset);
  const currentKey = weekKey(currentMonday);
  const days = groupRoutesByDay(currentMonday, rawRoutes);
  const holidayDays = days.filter(d => d.holiday).map(d => d.dayIndex);
  const currentFriday = new Date(currentMonday);
  currentFriday.setDate(currentMonday.getDate() + 4);
  const weekLabel = `${formatDayDate(currentMonday)} – ${formatDayDate(currentFriday)}`;

  useEffect(() => {
    let cancelled = false;
    async function loadWeek() {
      setLoading(true);
      let routes = await api(`/api/routes?week_key=${currentKey}`);
      if (routes.length === 0) {
        // Nieuwe week: vaste routes aanmaken en standaardrooster toepassen in één verzoek
        const seed = SEED_ROUTES_PER_DAY.flatMap((list, i) => list.map(r => ({ day_index: i, code: r.code })));
        routes = await api("/api/routes/new-week", { method: "POST", loading: true, body: { week_key: currentKey, routes: seed, skip_days: holidayDays } });
      }
      const routesWithFixed = routes.map(r => ({ ...r, fixed: isFixedRoute(r.day_index, r.code) }));
      if (!cancelled) { setRawRoutes(routesWithFixed); setLoading(false); }
    }
    loadWeek();
    api("/api/route-templates").then(rows => { if (!cancelled) setRouteTemplates(rows); });
    Object.keys(SHIFT_TEAMS).forEach(t => api(`/api/${t}-shifts?week_key=${currentKey}`).then(rows => { if (!cancelled) setTeamShifts(prev => ({ ...prev, [t]: rows })); }));
    return () => { cancelled = true; };
  }, [currentKey, reloadKey]);

  const absence = (driverName, isoDate) => absenceOn(vacations, driverName, isoDate);

  const addRoute = async dayIndex => {
    const created = await api("/api/routes", { method: "POST", body: { week_key: currentKey, day_index: dayIndex, code: "" } });
    setRawRoutes(prev => [...prev, { ...created, driver_name: null, fixed: false }]);
  };

  const removeRoute = async routeId => {
    await api(`/api/routes/${routeId}`, { method: "DELETE" });
    setRawRoutes(prev => prev.filter(r => r.id !== routeId));
  };

  const moveRoute = async (routeId, dayIndex, driverName) => {
    setRawRoutes(prev => prev.map(r => r.id === routeId ? { ...r, day_index: dayIndex, driver_name: driverName || null, driver_id: driverName ? driverIdByName[driverName] : null, fixed: isFixedRoute(dayIndex, r.code) } : r));
    await api(`/api/routes/${routeId}`, { method: "PATCH", body: { day_index: dayIndex, driver_id: driverName ? driverIdByName[driverName] : null } });
  };

  const updateRoute = async (routeId, field, value) => {
    setRawRoutes(prev => prev.map(r => r.id === routeId ? (field === "driver" ? { ...r, driver_name: value || null, driver_id: value ? driverIdByName[value] : null } : { ...r, code: value }) : r));
    const body = field === "driver" ? { driver_id: value ? driverIdByName[value] : null } : { code: value };
    await api(`/api/routes/${routeId}`, { method: "PATCH", body });
  };

  const reloadRoutes = async () => {
    const routes = await api(`/api/routes?week_key=${currentKey}`);
    setRawRoutes(routes.map(r => ({ ...r, fixed: isFixedRoute(r.day_index, r.code) })));
  };

  const saveTemplate = async (person, routes, applyToWeek) => {
    setRouteTemplates(await api(`/api/route-templates/${person.id}`, { method: "PUT", body: { routes } }));
    if (applyToWeek) {
      await api(`/api/routes/apply-template/${person.id}`, { method: "POST", body: { week_key: currentKey, skip_days: holidayDays } });
      await reloadRoutes();
    }
    setTemplatePerson(null);
  };

  const applyTemplate = async () => {
    await api("/api/routes/apply-template", { method: "POST", body: { week_key: currentKey, skip_days: holidayDays } });
    await reloadRoutes();
  };

  const clearWeek = async () => {
    if (!window.confirm("Alle routes van deze week terugzetten naar \"Niet toegewezen\"? De routes zelf blijven staan.")) return;
    setRawRoutes(prev => prev.map(r => ({ ...r, driver_name: null, driver_id: null })));
    await api("/api/routes/clear", { method: "POST", body: { week_key: currentKey } });
  };

  const isDriverInTeam = name => drivers.includes(name);

  const driverDayRoutes = {};
  drivers.forEach(name => {
    driverDayRoutes[name] = {};
    days.forEach(day => { driverDayRoutes[name][day.dayIndex] = []; });
  });
  days.forEach(day => {
    day.routes.forEach(route => {
      if (route.driver && driverDayRoutes[route.driver]) {
        driverDayRoutes[route.driver][day.dayIndex].push(route);
      }
    });
  });
  const unassignedByDay = {};
  days.forEach(day => {
    unassignedByDay[day.dayIndex] = day.routes.filter(r => !isDriverInTeam(r.driver));
  });

  // Namen van de dienstenteams (magazijn, productie) waarin een chauffeur die dag ook werkt
  const otherWorkOn = (name, dayIndex) => {
    const person = driversRaw.find(d => d.id === driverIdByName[name]);
    return Object.entries(SHIFT_TEAMS)
      .filter(([t, c]) => person && person[c.column] && (teamShifts[t] || []).some(w => w.driver_id === person.id && w.day_index === dayIndex))
      .map(([, c]) => c.name);
  };

  const handleDropOnCell = (e, dayIndex, targetDriverName) => {
    e.preventDefault();
    let data;
    try { data = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (err) { return; }
    if (!data) return;
    if (data.dayIndex !== dayIndex) {
      // Alleen routes van een feestdag mogen naar een andere dag
      if (days[data.dayIndex].holiday) moveRoute(data.routeId, dayIndex, targetDriverName);
      return;
    }
    updateRoute(data.routeId, "driver", targetDriverName || "");
  };

  function renderRouteChip(route, day, driverName) {
    // Rood als de chauffeur die dag vakantie heeft of ziek is
    const warn = driverName && ["vacation", "sick"].includes(absence(driverName, day.isoDate));
    return React.createElement("div", {
      key: route.id,
      className: "rr-driver-cell",
      draggable: true,
      onDragStart: e => { e.dataTransfer.setData("text/plain", JSON.stringify({ routeId: route.id, dayIndex: day.dayIndex })); },
      style: driverName
        ? { position: "relative", display: "flex", alignItems: "center", padding: "1px 4px", borderRadius: "4px", border: `1px solid ${warn ? "#C0433D" : "transparent"}`, background: warn ? "#FBEAE9" : "transparent", cursor: "grab" }
        : { position: "relative", display: "flex", alignItems: "center", padding: "3px 6px", borderRadius: "5px", border: "1px solid #E8C58A", background: "#FFFFFF", cursor: "grab" }
    },
      React.createElement("input", { className: "rr-code-input", style: { fontSize: "12.5px", textAlign: driverName ? "center" : "left", color: driverName && !warn ? "#2F6B3A" : "#4A5568", cursor: route.fixed ? "grab" : "text" }, value: route.code, placeholder: "Routenaam", readOnly: route.fixed, onChange: e => updateRoute(route.id, "code", e.target.value) }),
      // Knoppen alleen zichtbaar bij aanwijzen, zodat de naam van de route in het midden staat
      React.createElement("span", { className: "rr-chip-actions no-print", style: { position: "absolute", right: "4px", top: "50%", transform: "translateY(-50%)", display: "flex", gap: "5px", background: driverName ? (warn ? "#FBEAE9" : "#DDEFE0") : "#FFFFFF", paddingLeft: "3px" } },
        driverName && React.createElement("span", { title: "Terug naar niet toegewezen", onClick: () => updateRoute(route.id, "driver", ""), style: { cursor: "pointer", color: "#5A6472", fontSize: "12px" } }, "↩"),
        !route.fixed && React.createElement("span", { title: "Route verwijderen", onClick: () => removeRoute(route.id), style: { cursor: "pointer", color: "#A9433F", fontSize: "12px" } }, "×")
      )
    );
  }

  // Meerdere routes op één dag, "Amsterdam" verkort tot "A'dam". Elke route blijft los te slepen; ↩ en × bij aanwijzen.
  // TIJDELIJK twee weergaven waar Bennie uit kan kiezen (schakelaar bij de titel):
  //   A: labeltjes die doorlopen, B: onder elkaar
  const shortRouteName = code => (code || "route").replace(/^Amsterdam\b/, "A'dam");
  function renderMultiRoutes(routes, day, driverName) {
    const warnAll = ["vacation", "sick"].includes(absence(driverName, day.isoDate));
    const green = warnAll ? "#A9433F" : "#2F6B3A";
    const container = {
      A: { display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "3px" },
      B: { display: "flex", flexDirection: "column", alignItems: "center", lineHeight: 1.3 }
    }[multiStyle];
    const chip = {
      A: { background: warnAll ? "#FBEAE9" : "#FFFFFF", border: `1px solid ${warnAll ? "#C0433D" : "#7DB587"}`, borderRadius: "10px", padding: "0 7px", fontSize: "11.5px", lineHeight: "18px" },
      B: { padding: "0 2px", borderRadius: "3px", background: warnAll ? "#FBEAE9" : "transparent" }
    }[multiStyle];
    return React.createElement("div", { className: `rr-multi-routes rr-multi-${multiStyle}`, title: routes.map(r => r.code || "route").join(" · "), style: { ...container, fontFamily: "'IBM Plex Mono', monospace", fontSize: "12.5px", fontWeight: 600, color: green } },
      routes.map(route =>
        React.createElement("span", {
          key: route.id, className: "rr-driver-cell rr-multi-route", draggable: true, title: route.code || "route",
          onDragStart: e => { e.dataTransfer.setData("text/plain", JSON.stringify({ routeId: route.id, dayIndex: day.dayIndex })); },
          style: { position: "relative", whiteSpace: "nowrap", cursor: "grab", ...chip }
        },

function CombinedPrint({ weekOffset, driversRaw, vacations, onDone }) {
  const [data, setData] = useState(null);

    if (!data) return;
    const timer = setTimeout(() => { window.print(); onDone(); }, 0);

        cell.empty ? "–" : cell.lines.map((line, i) => React.createElement("div", { key: i, style: lineStyle }, line)));
    })
  );
  const sectionRow = label => React.createElement("tr", { key: `section-${label}` },
    React.createElement("td", { colSpan: 6, style: { padding: "8px 4px 3px", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: "14px", color: "#000000", borderBottom: "2px solid #000000" } }, label)

  const legend = [["Chauffeur", PRINT_COLORS.driver], ["Magazijn", PRINT_COLORS.warehouse], ["Productie", PRINT_COLORS.production], ["Vakantie/vrij", PRINT_COLORS.vacation], ["Ziek", PRINT_COLORS.sick], ["Niet beschikbaar", PRINT_COLORS.unavailable]];

    React.createElement("style", null, `

    React.createElement("table", { style: { width: "100%", borderCollapse: "collapse", tableLayout: "fixed" } },
      React.createElement("colgroup", null,
        React.createElement("col", { style: { width: "80px" } }),
        days.map(day => React.createElement("col", { key: day.id }))

// Easter egg: piepklein 🏆 rechtsonder opent de Hall of Fame met weetjes uit /api/stats
const MILESTONES = {
  routes: [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000],
  hours: [100, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000]
};
const nl = n => Number(n).toLocaleString("nl-NL");
const longDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
const listNl = items => items.length <= 1 ? items.join("") : `${items.slice(0, -1).join(", ")} en ${items[items.length - 1]}`;

// Hoogste mijlpaal die gehaald is maar in deze browser nog niet gevierd; bewaart wat al gevierd is
function newMilestone(stats) {
  const reached = key => MILESTONES[key].filter(m => (key === "routes" ? stats.totalRoutes : stats.hours) >= m).pop() || 0;
  const now = { routes: reached("routes"), hours: reached("hours") };
  let seen = { routes: 0, hours: 0 };
  try { seen = { ...seen, ...JSON.parse(localStorage.getItem("rr-fame-milestones") || "{}") }; } catch (err) {}
  try { localStorage.setItem("rr-fame-milestones", JSON.stringify({ routes: Math.max(now.routes, seen.routes), hours: Math.max(now.hours, seen.hours) })); } catch (err) {}
  if (now.routes > seen.routes) return `${nl(now.routes)} routes gereden!`;
  if (now.hours > seen.hours) return `${nl(now.hours)} uur gewerkt in magazijn en productie!`;
  return null;
}

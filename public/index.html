<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Weekrooster routes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect } = React;

const DAY_NAMES = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag"];
function getMondayOfThisWeek() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  return monday;
}
function formatDayDate(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
}
function formatDayDateWithYear(date) {
  return date.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric" });
}

const SEED_ROUTES_PER_DAY = [
  [
    { code: "We Supply" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "We Supply" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" }
  ],
  [
    { code: "Haarlem" },
    { code: "Noord-Holland" },
    { code: "'s Hertogenbosch" },
    { code: "Den Haag" },
    { code: "Rotterdam" },
    { code: "West Brabant" }
  ],
  [
    { code: "Oost 1" },
    { code: "Oost 2" },
    { code: "Oost Brabant" },
    { code: "'t Gooi" },
    { code: "Groene Hart" },
    { code: "Noord" }
  ],
  [
    { code: "Vroeg 1" },
    { code: "Vroeg 2" },
    { code: "Amsterdam Centrum" },
    { code: "Amsterdam Zuid" },
    { code: "Amsterdam Extra" },
    { code: "Zeeland" },
    { code: "Den Haag" },
    { code: "Rotterdam" }
  ]
];
function isFixedRoute(dayIndex, code) {
  return SEED_ROUTES_PER_DAY[dayIndex].some(r => r.code === code);
}

function weekKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function addWeeks(date, n) { const d = new Date(date); d.setDate(d.getDate() + n * 7); return d; }

function groupRoutesByDay(monday, rawRoutes) {
  return DAY_NAMES.map((name, i) => {
    const dateObj = new Date(monday);
    dateObj.setDate(monday.getDate() + i);
    return {
      id: `day-${i}`,
      dayIndex: i,
      name,
      date: formatDayDate(dateObj),
      isoDate: weekKey(dateObj),
      routes: rawRoutes.filter(r => r.day_index === i).map(r => ({ id: r.id, code: r.code, driver: r.driver_name || "", fixed: r.fixed }))
    };
  });
}

function RouteRooster() {
  const [weekOffset, setWeekOffset] = useState(0);
  const [rawRoutes, setRawRoutes] = useState([]);
  const [driversRaw, setDriversRaw] = useState([]);
  const [newDriver, setNewDriver] = useState("");
  const [vacations, setVacations] = useState([]);
  const [vacDriver, setVacDriver] = useState("");
  const [vacStart, setVacStart] = useState("");
  const [vacEnd, setVacEnd] = useState("");
  const [loading, setLoading] = useState(true);

  const drivers = driversRaw.map(d => d.name);
  const driverIdByName = Object.fromEntries(driversRaw.map(d => [d.name, d.id]));
  const currentMonday = addWeeks(getMondayOfThisWeek(), weekOffset);
  const currentKey = weekKey(currentMonday);
  const days = groupRoutesByDay(currentMonday, rawRoutes);
  const currentFriday = new Date(currentMonday);
  currentFriday.setDate(currentMonday.getDate() + 4);
  const weekLabel = `${formatDayDate(currentMonday)} – ${formatDayDate(currentFriday)}`;

  useEffect(() => {
    fetch("/api/drivers").then(r => r.json()).then(setDriversRaw);
    fetch("/api/vacations").then(r => r.json()).then(setVacations);
  }, []);
  useEffect(() => {
    if (!vacDriver && drivers.length > 0) setVacDriver(drivers[0]);
  }, [driversRaw]);

  useEffect(() => {
    let cancelled = false;
    async function loadWeek() {
      setLoading(true);
      const res = await fetch(`/api/routes?week_key=${currentKey}`);
      let routes = await res.json();
      if (routes.length === 0) {
        for (let i = 0; i < SEED_ROUTES_PER_DAY.length; i++) {
          for (const r of SEED_ROUTES_PER_DAY[i]) {
            await fetch("/api/routes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ week_key: currentKey, day_index: i, code: r.code })
            });
          }
        }
        const res2 = await fetch(`/api/routes?week_key=${currentKey}`);
        routes = await res2.json();
      }
      const routesWithFixed = routes.map(r => ({ ...r, fixed: isFixedRoute(r.day_index, r.code) }));
      if (!cancelled) { setRawRoutes(routesWithFixed); setLoading(false); }
    }
    loadWeek();
    return () => { cancelled = true; };
  }, [currentKey]);

  const isDriverOnVacation = (driverName, isoDate) =>
    vacations.some(v => v.driver_name === driverName && isoDate >= v.start_date && isoDate <= v.end_date);

  const addVacation = async () => {
    if (!vacDriver || !vacStart || !vacEnd || vacStart > vacEnd) return;
    const driver_id = driverIdByName[vacDriver];
    const res = await fetch("/api/vacations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driver_id, start_date: vacStart, end_date: vacEnd })
    });
    const created = await res.json();
    setVacations(prev => [...prev, { ...created, driver_name: vacDriver }]);
    setVacStart(""); setVacEnd("");
  };

  const removeVacation = async id => {
    await fetch(`/api/vacations/${id}`, { method: "DELETE" });
    setVacations(prev => prev.filter(v => v.id !== id));
  };

  const addDriver = async () => {
    const name = newDriver.trim();
    if (!name || drivers.includes(name)) return;
    const res = await fetch("/api/drivers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const created = await res.json();
    setDriversRaw(prev => [...prev, created]);
    setNewDriver("");
  };

  const removeDriver = async name => {
    const id = driverIdByName[name];
    if (id === undefined) return;
    await fetch(`/api/drivers/${id}`, { method: "DELETE" });
    setDriversRaw(prev => prev.filter(d => d.name !== name));
    setVacations(prev => prev.filter(v => v.driver_name !== name));
    setRawRoutes(prev => prev.map(r => r.driver_name === name ? { ...r, driver_id: null, driver_name: null } : r));
  };

  const addRoute = async dayIndex => {
    const res = await fetch("/api/routes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ week_key: currentKey, day_index: dayIndex, code: "" })
    });
    const created = await res.json();
    setRawRoutes(prev => [...prev, { ...created, driver_name: null, fixed: false }]);
  };

  const removeRoute = async routeId => {
    await fetch(`/api/routes/${routeId}`, { method: "DELETE" });
    setRawRoutes(prev => prev.filter(r => r.id !== routeId));
  };

  const updateRoute = async (routeId, field, value) => {
    setRawRoutes(prev => prev.map(r => r.id === routeId ? (field === "driver" ? { ...r, driver_name: value || null } : { ...r, code: value }) : r));
    const body = field === "driver" ? { driver_id: value ? driverIdByName[value] : null } : { code: value };
    await fetch(`/api/routes/${routeId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  };

  const totalRoutes = days.reduce((sum, d) => sum + d.routes.length, 0);
  const openRoutes = days.reduce((sum, d) => sum + d.routes.filter(r => !r.driver.trim()).length, 0);

  const driverDayRoutes = {};
  drivers.forEach(name => {
    driverDayRoutes[name] = {};
    days.forEach(day => { driverDayRoutes[name][day.dayIndex] = []; });
  });
  days.forEach(day => {
    day.routes.forEach(route => {
      if (route.driver && driverDayRoutes[route.driver]) {
        driverDayRoutes[route.driver][day.dayIndex].push(route);
      }
    });
  });
  const unassignedByDay = {};
  days.forEach(day => {
    unassignedByDay[day.dayIndex] = day.routes.filter(r => !r.driver.trim());
  });

  const handleDropOnCell = (e, dayIndex, targetDriverName) => {
    e.preventDefault();
    let data;
    try { data = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (err) { return; }
    if (!data || data.dayIndex !== dayIndex) return;
    updateRoute(data.routeId, "driver", targetDriverName || "");
  };

  function renderRouteChip(route, day, driverName) {
    const isOnVac = driverName && isDriverOnVacation(driverName, day.isoDate);
    const warn = isOnVac;
    return React.createElement("div", {
      key: route.id,
      className: "rr-driver-cell",
      draggable: true,
      onDragStart: e => { e.dataTransfer.setData("text/plain", JSON.stringify({ routeId: route.id, dayIndex: day.dayIndex })); },
      style: { display: "flex", alignItems: "center", gap: "5px", padding: "4px 6px", marginBottom: "4px", borderRadius: "5px", border: `1px solid ${warn ? "#C0433D" : "#DCE5DC"}`, background: warn ? "#FBEAE9" : "#F3F8F3", cursor: "grab" }
    },
      React.createElement("input", { className: "rr-code-input", style: { fontSize: "12.5px", cursor: route.fixed ? "default" : "text" }, value: route.code, placeholder: "Routenaam", readOnly: route.fixed, onChange: e => updateRoute(route.id, "code", e.target.value) }),
      driverName && React.createElement("span", { className: "no-print", title: "Terug naar niet toegewezen", onClick: () => updateRoute(route.id, "driver", ""), style: { cursor: "pointer", color: "#8A93A0", fontSize: "12px", flexShrink: 0 } }, "↩"),
      !route.fixed && React.createElement("span", { className: "no-print", title: "Route verwijderen", onClick: () => removeRoute(route.id), style: { cursor: "pointer", color: "#A9433F", fontSize: "12px", flexShrink: 0 } }, "×")
    );
  }

  const gridChildren = [];
  gridChildren.push(React.createElement("div", { key: "hdr-empty" }, ""));
  days.forEach(day => gridChildren.push(
    React.createElement("div", { key: `hdr-${day.id}`, style: { fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: "12.5px", padding: "4px 2px" } }, day.name, " ", React.createElement("span", { style: { fontSize: "10.5px", color: "#8A93A0", fontWeight: 400, fontFamily: "'IBM Plex Mono', monospace" } }, day.date))
  ));

    const totalUnassigned = days.reduce((sum, d) => sum + unassignedByDay[d.dayIndex].length, 0);
  const unassignedPrintClass = totalUnassigned === 0 ? "no-print" : "";
  gridChildren.push(React.createElement("div", { key: "unassigned-label", className: unassignedPrintClass, style: { fontSize: "12px", fontWeight: 600, color: "#5A6472", alignSelf: "flex-start", paddingTop: "6px" } }, "Niet toegewezen"));
  days.forEach(day => {
    const list = unassignedByDay[day.dayIndex];
    gridChildren.push(React.createElement("div", {
      key: `unassigned-${day.id}`,
      className: unassignedPrintClass,
      onDragOver: e => { e.preventDefault(); e.currentTarget.style.background = "#FBEDD0"; },
      onDragLeave: e => { e.currentTarget.style.background = "#FDF6EC"; },
      onDrop: e => { e.currentTarget.style.background = "#FDF6EC"; handleDropOnCell(e, day.dayIndex, null); },
      style: { background: "#FDF6EC", border: "1px solid #E8A33D", borderRadius: "6px", padding: "4px", minHeight: "26px" }
    },
      list.map(route => renderRouteChip(route, day, null)),
      React.createElement("button", { className: "rr-add-btn no-print", onClick: () => addRoute(day.dayIndex), style: { width: "100%", marginTop: "2px", padding: "4px 0", borderRadius: "5px", border: "1px dashed #B8BFC6", background: "transparent", color: "#5A6472", fontSize: "11px", cursor: "pointer" } }, "+ route")
    ));
  });
  gridChildren.push(React.createElement("div", { key: "divider-unassigned", className: unassignedPrintClass, style: { gridColumn: "1 / -1", height: "1px", background: "#C9CDD3", margin: "4px 0" } }));

  drivers.forEach(name => {
    gridChildren.push(React.createElement("div", { key: `drv-${name}`, style: { fontSize: "12.5px", fontWeight: 600, alignSelf: "flex-start", paddingTop: "8px" } }, name));
    days.forEach(day => {
      const onVac = isDriverOnVacation(name, day.isoDate);
      const assigned = driverDayRoutes[name][day.dayIndex];
      const baseColor = onVac ? "#F1EAFB" : "#FFFFFF";
      gridChildren.push(React.createElement("div", {
        key: `cell-${name}-${day.id}`,
        onDragOver: e => { if (onVac) return; e.preventDefault(); e.currentTarget.style.background = "#E8F4EA"; },
        onDragLeave: e => { e.currentTarget.style.background = baseColor; },
        onDrop: e => { if (onVac) return; e.currentTarget.style.background = baseColor; handleDropOnCell(e, day.dayIndex, name); },
        style: { background: baseColor, border: `1px solid ${onVac ? "#C9B6E8" : "#E3E6E9"}`, borderRadius: "6px", padding: "4px", minHeight: "26px" }
      },
        onVac && React.createElement("div", { style: { fontSize: "10.5px", color: "#4B2E7A", fontWeight: 600, marginBottom: "4px" } }, "Vakantie"),
        assigned.map(route => renderRouteChip(route, day, name))
      ));
    });
    gridChildren.push(React.createElement("div", { key: `divider-${name}`, style: { gridColumn: "1 / -1", height: "1px", background: "#E3E6E9", margin: "4px 0" } }));
  });

  return React.createElement("div", { className: "rr-print-root", style: { minHeight: "100%", background: "#EDF0F2", fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1B2A4A", padding: "28px 20px 60px" } },
    React.createElement("style", null, `
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
      .rr-input { font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; border: none; background: transparent; outline: none; width: 100%; color: #1B2A4A; }
      .rr-input::placeholder { color: #A9433F; opacity: 0.85; font-weight: 500; }
      .rr-driver-chip:hover .rr-driver-x { opacity: 1; }
      .rr-driver-x { opacity: 0; transition: opacity 0.12s ease; cursor: pointer; }
      .rr-code-input { font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; font-weight: 600; border: none; background: transparent; outline: none; width: 100%; color: #4A5568; letter-spacing: 0.01em; }
      .rr-add-btn:hover { background: #1B2A4A; color: #EDF0F2; }
      .rr-vac-add-btn:hover { background: #14203a; border-color: #14203a; }
      @media print {
        .no-print { display: none !important; }
        body { background: #fff !important; }
        html, body, #root { min-height: auto !important; }
        .rr-print-root { background: #fff !important; padding: 6px !important; min-height: auto !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .rr-driver-grid { grid-template-columns: 70px repeat(5, 1fr) !important; gap: 3px !important; padding: 6px !important; border: none !important; }
        .rr-driver-cell { padding: 2px 4px !important; margin-bottom: 2px !important; break-inside: avoid; }
        .rr-code-input { font-size: 10px !important; }
        h1 { font-size: 18px !important; margin-bottom: 2px !important; }
        p { font-size: 10px !important; }
      }
    `),
    React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: "24px", flexWrap: "wrap", gap: "16px" } },
      React.createElement("div", null,
        React.createElement("h1", { style: { fontFamily: "'Space Grotesk', sans-serif", fontSize: "26px", fontWeight: 700, margin: 0, letterSpacing: "-0.01em" } }, "Weekrooster routes"),
        React.createElement("p", { className: "no-print", style: { margin: "6px 0 0", fontSize: "13.5px", color: "#5A6472" } }, "Sleep een route naar een chauffeur om toe te wijzen. Onbezette routes blijven zichtbaar."),
        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "10px", marginTop: "12px" } },
          React.createElement("button", { className: "no-print", onClick: () => setWeekOffset(w => w - 1), style: { border: "1px solid #C9CDD3", background: "#FFFFFF", borderRadius: "6px", padding: "5px 11px", fontSize: "13px", color: "#1B2A4A", cursor: "pointer" } }, "← vorige week"),
          React.createElement("span", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: "13px", color: "#1B2A4A", minWidth: "120px", textAlign: "center" } }, weekLabel, weekOffset === 0 && React.createElement("span", { className: "no-print", style: { color: "#5A6472", marginLeft: "6px" } }, "(deze week)")),
          React.createElement("button", { className: "no-print", onClick: () => setWeekOffset(w => w + 1), style: { border: "1px solid #C9CDD3", background: "#FFFFFF", borderRadius: "6px", padding: "5px 11px", fontSize: "13px", color: "#1B2A4A", cursor: "pointer" } }, "volgende week →"),
          weekOffset !== 0 && React.createElement("button", { className: "no-print", onClick: () => setWeekOffset(0), style: { border: "none", background: "transparent", fontSize: "12.5px", color: "#5A6472", textDecoration: "underline", cursor: "pointer" } }, "naar vandaag")
        )
      ),
      React.createElement("div", { className: "no-print", style: { display: "flex", gap: "10px" } },
        React.createElement("div", { style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "6px", padding: "10px 16px", textAlign: "center", minWidth: "84px" } },
          React.createElement("div", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: "20px", fontWeight: 600 } }, totalRoutes),
          React.createElement("div", { style: { fontSize: "11px", color: "#5A6472", marginTop: "2px" } }, "routes totaal")
        ),
        React.createElement("div", { style: { background: openRoutes > 0 ? "#FBEDE0" : "#FFFFFF", border: `1px solid ${openRoutes > 0 ? "#E8A33D" : "#C9CDD3"}`, borderRadius: "6px", padding: "10px 16px", textAlign: "center", minWidth: "84px" } },
          React.createElement("div", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: "20px", fontWeight: 600, color: openRoutes > 0 ? "#A9433F" : "#1B2A4A" } }, openRoutes),
          React.createElement("div", { style: { fontSize: "11px", color: "#5A6472", marginTop: "2px" } }, "nog niet ingevuld")
        ),
        React.createElement("button", { onClick: () => window.print(), style: { border: "1px solid #1B2A4A", background: "#1B2A4A", color: "#FFFFFF", borderRadius: "6px", padding: "0 16px", fontSize: "13px", cursor: "pointer" } }, "Print rooster")
      )
    ),
    React.createElement("div", { style: { display: "flex", gap: "16px", alignItems: "flex-start", flexWrap: "wrap" } },
      React.createElement("div", { className: "rr-driver-grid", style: { display: "grid", gridTemplateColumns: "80px repeat(5, 200px)", gap: "5px", background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px" } }, gridChildren),
      React.createElement("div", { className: "no-print", style: { display: "flex", flexDirection: "column", gap: "12px", width: "300px", flexShrink: 0 } },
  React.createElement("div", { style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px" } },
    React.createElement("div", { style: { fontSize: "13px", fontWeight: 600, color: "#5A6472", marginBottom: "8px" } }, "Vakantie/vrij"),
    React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px" } },
      React.createElement("select", { value: vacDriver, onChange: e => setVacDriver(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "13px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "4px 6px", background: "#FFFFFF", color: "#1B2A4A" } },
        drivers.map(name => React.createElement("option", { key: name, value: name }, name))
      ),
      React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "6px" } },
        React.createElement("input", { type: "date", value: vacStart, onChange: e => setVacStart(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } }),
        React.createElement("span", { style: { color: "#8A93A0", fontSize: "12px" } }, "t/m"),
        React.createElement("input", { type: "date", value: vacEnd, onChange: e => setVacEnd(e.target.value), style: { fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "12.5px", border: "1px solid #C9CDD3", borderRadius: "5px", padding: "3px 4px", color: "#1B2A4A", flex: 1, minWidth: 0 } })
      ),
      React.createElement("button", { className: "rr-vac-add-btn", onClick: addVacation, style: { width: "100%", border: "1px solid #1B2A4A", background: "#1B2A4A", color: "#FFFFFF", borderRadius: "5px", padding: "6px 9px", fontSize: "12.5px", fontWeight: 600, cursor: "pointer", marginTop: "2px" } }, "Toevoegen")
    ),
    vacations.length > 0 && React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px" } },
      vacations.map(v => {
        const isSameDay = v.start_date === v.end_date;
        const label = isSameDay
          ? formatDayDateWithYear(new Date(v.start_date))
          : `${formatDayDateWithYear(new Date(v.start_date))} – ${formatDayDateWithYear(new Date(v.end_date))}`;
        return React.createElement("div", { key: v.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "6px", background: "#FBEDE0", border: "1px solid #E8A33D", borderRadius: "6px", padding: "4px 8px", fontSize: "12px", color: "#7A3B10" } },
          React.createElement("span", null, v.driver_name, ": ", label),
          React.createElement("span", { onClick: () => removeVacation(v.id), title: "Verwijderen", style: { cursor: "pointer", color: "#A9433F", flexShrink: 0 } }, "×")
        );
      })
    )
  ),
  React.createElement("div", { style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px" } },
    React.createElement("div", { style: { fontSize: "13px", fontWeight: 600, color: "#5A6472", marginBottom: "8px" } }, "Ingepland deze week"),
    React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "4px" } },
      drivers.map(name => {
        const count = days.reduce((sum, day) => sum + driverDayRoutes[name][day.dayIndex].length, 0);
        return React.createElement("div", { key: name, style: { display: "flex", justifyContent: "space-between", fontSize: "12.5px", color: count === 0 ? "#A9433F" : "#1B2A4A" } },
          React.createElement("span", null, name),
          React.createElement("span", { style: { fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 } }, count)
        );
      })
    )
  )
)
    ),
    React.createElement("div", { className: "no-print", style: { background: "#FFFFFF", border: "1px solid #C9CDD3", borderRadius: "8px", padding: "12px 14px", marginTop: "16px", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" } },
      React.createElement("span", { style: { fontSize: "12.5px", color: "#5A6472", flexShrink: 0 } }, "Chauffeurs:"),
      drivers.map(name => React.createElement("span", { key: name, className: "rr-driver-chip", style: { display: "inline-flex", alignItems: "center", gap: "6px", background: "#F3F8F3", border: "1px solid #DCE5DC", borderRadius: "14px", padding: "3px 10px", fontSize: "13px" } },
        name,
        React.createElement("span", { className: "rr-driver-x", onClick: () => removeDriver(name), title: `${name} verwijderen`, style: { color: "#A9433F", fontSize: "12px" } }, "×")
      )),
      React.createElement("span", { style: { display: "inline-flex", alignItems: "center", gap: "4px", marginLeft: "4px" } },
        React.createElement("input", { className: "rr-input", style: { width: "110px", borderBottom: "1px solid #C9CDD3", padding: "3px 2px" }, value: newDriver, placeholder: "nieuwe naam", onChange: e => setNewDriver(e.target.value), onKeyDown: e => e.key === "Enter" && addDriver() }),
        React.createElement("button", { onClick: addDriver, style: { border: "1px solid #C9CDD3", background: "transparent", borderRadius: "5px", padding: "3px 9px", fontSize: "12.5px", color: "#1B2A4A", cursor: "pointer" } }, "+ toevoegen")
      )
    ),
    loading && React.createElement("p", { className: "no-print", style: { fontSize: "12px", color: "#8A93A0", marginTop: "8px" } }, "Rooster laden…"),
    React.createElement("p", { className: "no-print", style: { marginTop: "22px", fontSize: "12px", color: "#8A93A0", maxWidth: "520px" } }, "Alles wordt automatisch opgeslagen op de server, ook na een refresh of tussen sessies.")
  );
